name: Build and Release Assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "𝙫*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn

      - name: Build project
        run: yarn build

      - name: Update theme configuration
        run: |
          # Extract version from tag (remove 'v' or '𝙫' prefix)
          ORIGINAL_VERSION=${GITHUB_REF_NAME#v}
          ORIGINAL_VERSION=${ORIGINAL_VERSION#𝙫}

          # Normalize Unicode fancy/bold digits to ASCII (e.g. 𝟮𝟬𝟮𝟲 → 2026) for validation only
          VERSION=$(echo "$ORIGINAL_VERSION" | python3 -c "import sys, unicodedata; print(unicodedata.normalize('NFKC', sys.stdin.read().strip()))")

          # Validate version format (X.Y.Z.W)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version '$VERSION' is not a valid 4-part version (X.Y.Z.W format)"
            echo "Expected format: X.Y.Z.W (e.g., 1.2.3.4)"
            exit 1
          fi

          echo "Valid version detected: $VERSION (original: $ORIGINAL_VERSION)"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          # Update komari-theme.json with original version (preserving Unicode bold digits if used)
          jq --arg version "$ORIGINAL_VERSION" \
              '.version = $version' \
              komari-theme.json > komari-theme-updated.json

          mv komari-theme-updated.json komari-theme.json

          echo "Updated theme configuration:"
          cat komari-theme.json

      - name: Verify required files exist
        run: |
          echo "Checking required files..."
          ls -la preview.png || (echo "preview.png not found" && exit 1)
          ls -la komari-theme.json || (echo "komari-theme.json not found" && exit 1)
          ls -la dist/ || (echo "dist/ directory not found" && exit 1)
          echo "All required files found!"

      - name: Create theme package
        run: |
          # Create a temporary directory for the package
          mkdir -p theme-package

          # Copy required files
          cp preview.png theme-package/
          cp komari-theme.json theme-package/
          cp -r dist/ theme-package/

          ZIP_NAME="komari-theme-purcarte-plus.zip"

          cd theme-package
          zip -r ../${ZIP_NAME} .
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "Created package: ${ZIP_NAME}"
          ls -la ${ZIP_NAME}

      - name: Generate Changelog
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/𝙫'))
        id: changelog
        shell: bash
        run: |
          git fetch --force --tags --prune

          CURRENT_TAG="$GITHUB_REF_NAME"
          CURRENT_COMMIT=$(git rev-parse "${CURRENT_TAG}^{commit}")
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 \
            --match 'v*' \
            --match '𝙫*' \
            "${CURRENT_COMMIT}^" 2>/dev/null || true)

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Previous stable tag: $PREVIOUS_TAG"
            CHANGELOG=$(git log \
              --no-merges \
              --pretty=format:'* %s (%h)' \
              "${PREVIOUS_TAG}..${CURRENT_TAG}")
          else
            echo "No previous stable tag found; using full history"
            CHANGELOG=$(git log \
              --no-merges \
              --pretty=format:'* %s (%h)' \
              "$CURRENT_TAG")
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="* No new commits since ${PREVIOUS_TAG:-repository start}"
          fi

          {
            echo 'CHANGELOG<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Create Release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/𝙫'))
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ env.CHANGELOG }}
          draft: false
          prerelease: false
          files: ${{ env.ZIP_NAME }}
